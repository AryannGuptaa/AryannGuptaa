<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="agFooterTitle agFooterDesc">
  <title id="agFooterTitle">End of Aryan Gupta's profile</title>
  <desc id="agFooterDesc">A minimal burgundy signal line with the words build with intent.</desc>
  <defs>
    <linearGradient id="agFooterBackground" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#171815"/>
      <stop offset="0.5" stop-color="#20211D"/>
      <stop offset="1" stop-color="#171815"/>
    </linearGradient>
    <linearGradient id="agFooterLine" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5F8B78" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#5F8B78"/>
      <stop offset="0.5" stop-color="#DCE5DF"/>
      <stop offset="0.8" stop-color="#5F8B78"/>
      <stop offset="1" stop-color="#5F8B78" stop-opacity="0"/>
    </linearGradient>
    <filter id="agFooterGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .ag-footer-dot { animation: agFooterTravel 6s ease-in-out infinite; }
    @keyframes agFooterTravel { 0%, 100% { transform: translateX(-340px); opacity: 0; } 15%, 85% { opacity: 1; } 50% { transform: translateX(340px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ag-footer-dot { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="110" rx="18" fill="url(#agFooterBackground)" stroke="#315C4C"/>
  <path d="M90 56H1110" stroke="url(#agFooterLine)" stroke-width="1.5"/>
  <circle class="ag-footer-dot" cx="600" cy="56" r="4" fill="#F1EEE6" filter="url(#agFooterGlow)"/>
  <rect x="484" y="38" width="232" height="36" rx="18" fill="#20211D" stroke="#5F8B78"/>
  <text x="600" y="61" text-anchor="middle" fill="#DCE5DF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5">BUILD WITH INTENT</text>
</svg>
